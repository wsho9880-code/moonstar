<!DOCTYPE html>
<html lang="zh-HK">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>🌟 Moon 的星星獎勵樂園 🌟</title>
 <!-- Tailwind CSS -->
 <script src="https://cdn.tailwindcss.com"></script>
 <!-- FontAwesome Icons -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <!-- Google Fonts -->
 <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+HK:wght@400;700&display=swap" rel="stylesheet">
 <style>
 body {
 font-family: 'Fredoka', 'Noto Sans HK', sans-serif;
 background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 50%, #bfdbfe 100%);
 min-height: 100vh;
 }
 .star-bounce {
 animation: bounce 1s infinite alternate;
 }
 @keyframes bounce {
 0% { transform: translateY(0) scale(1); }
 100% { transform: translateY(-8px) scale(1.1); }
 }
 </style>
</head>
<body class="text-slate-700 pb-12">

 <header class="bg-white/85 backdrop-blur-md shadow-md sticky top-0 z-50">
 <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
 <div class="flex items-center space-x-2">
 <span class="text-3xl star-bounce">🌟</span>
 <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">Moon 的星星樂園</h1>
 </div>
 <div class="flex items-center space-x-2">
 <button id="viewModeToggle" onclick="toggleViewMode()" class="px-3 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-700 font-semibold rounded-full text-sm transition shadow-sm flex items-center space-x-1">
 <i class="fa-solid fa-user-gear"></i>
 <span id="modeText">家長模式</span>
 </button>
 <button onclick="fetchCloudData()" class="px-3 py-1.5 bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-full text-sm transition shadow-sm flex items-center space-x-1">
 <i class="fa-solid fa-cloud-arrow-down"></i>
 <span>強制同步雲端</span>
 </button>
 </div>
 </div>
 </header>

 <main class="max-w-4xl mx-auto px-4 mt-6">

 <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 shadow-xl border-4 border-yellow-200 text-center relative overflow-hidden mb-8">
 <div class="absolute -right-10 -top-10 text-yellow-100 text-9xl font-bold select-none pointer-events-none">🌟</div>
 <h2 id="childGreeting" class="text-2xl md:text-3xl font-bold text-pink-600 mb-2">你好呀，Moon！</h2>
 <p class="text-slate-500 text-sm mb-4">繼續努力儲星星，解鎖心儀的獎勵啦！</p>
 
 <div class="inline-flex items-center justify-center bg-gradient-to-r from-yellow-400 to-amber-500 text-white px-8 py-4 rounded-full shadow-lg space-x-3 mb-4">
 <i class="fa-solid fa-star text-4xl text-yellow-100 animate-spin" style="animation-duration: 8s;"></i>
 <div class="text-left">
 <div class="text-xs uppercase tracking-wider text-yellow-100 font-semibold">目前擁有星星</div>
 <div id="totalStars" class="text-4xl md:text-5xl font-black">12</div>
 </div>
 </div>

 <div id="syncStatusIndicator" class="text-xs text-slate-500 font-medium mb-2">
 <i class="fa-solid fa-cloud text-amber-500 mr-1"></i> 正在連線雲端資料...
 </div>

 <!-- Parent Quick Controls -->
 <div id="parentControls" class="parent-only flex flex-wrap justify-center gap-3 mt-3 hidden">
 <button onclick="adjustStars(1)" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center space-x-1">
 <i class="fa-solid fa-plus"></i><span>加 1 星</span>
 </button>
 <button onclick="adjustStars(5)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center space-x-1">
 <i class="fa-solid fa-plus"></i><span>加 5 星</span>
 </button>
 <button onclick="openSetStarsModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center space-x-1">
 <i class="fa-solid fa-pen-to-square"></i><span>修改總星星數</span>
 </button>
 <button onclick="openCustomTaskModal()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center space-x-1">
 <i class="fa-solid fa-list-check"></i><span>自訂加星</span>
 </button>
 <button id="undoBtn" onclick="undoLastAction()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center space-x-1 disabled:opacity-50 disabled:cursor-not-allowed">
 <i class="fa-solid fa-rotate-left"></i><span>復原上一筆操作 (Undo)</span>
 </button>
 <button onclick="openChangePinModal()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center space-x-1">
 <i class="fa-solid fa-key"></i><span>修改密碼</span>
 </button>
 </div>
 </div>

 <div class="flex justify-center space-x-4 mb-6">
 <button onclick="switchTab('rewards')" id="tabRewardsBtn" class="px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-pink-500 text-white">
 <i class="fa-solid fa-gift mr-1"></i> 獎勵兌換
 </button>
 <button onclick="switchTab('tasks')" id="tabTasksBtn" class="px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-white/80 text-slate-600 hover:bg-white">
 <i class="fa-solid fa-star-of-life mr-1"></i> 儲星任務
 </button>
 <button onclick="switchTab('history')" id="tabHistoryBtn" class="px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-white/80 text-slate-600 hover:bg-white">
 <i class="fa-solid fa-clock-rotate-left mr-1"></i> 紀錄
 </button>
 </div>

 <!-- Tab 1: Rewards Section -->
 <div id="tabRewards" class="space-y-4">
 <div class="flex justify-between items-center mb-2">
 <h3 class="text-lg font-bold text-slate-700 flex items-center">
 <i class="fa-solid fa-box-open text-pink-500 mr-2"></i> 可以兌換的獎勵
 </h3>
 <button onclick="openAddRewardModal()" class="parent-only hidden px-3 py-1 bg-pink-100 text-pink-600 font-semibold rounded-lg text-sm hover:bg-pink-200 transition">
 <i class="fa-solid fa-plus mr-1"></i>新增獎勵
 </button>
 </div>
 <div id="rewardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
 </div>

 <!-- Tab 2: Tasks Section -->
 <div id="tabTasks" class="space-y-4 hidden">
 <div class="flex justify-between items-center mb-2">
 <h3 class="text-lg font-bold text-slate-700 flex items-center">
 <i class="fa-solid fa-clipboard-list text-blue-500 mr-2"></i> Moon 的今日好行為 / 任務
 </h3>
 <button onclick="openAddTaskModal()" class="parent-only hidden px-3 py-1 bg-blue-100 text-blue-600 font-semibold rounded-lg text-sm hover:bg-blue-200 transition">
 <i class="fa-solid fa-plus mr-1"></i>新增任務
 </button>
 </div>
 <div id="tasksGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
 </div>

 <!-- Tab 3: History Section -->
 <div id="tabHistory" class="space-y-3 hidden">
 <div class="flex justify-between items-center mb-2">
 <h3 class="text-lg font-bold text-slate-700 flex items-center">
 <i class="fa-solid fa-history text-purple-500 mr-2"></i> 星星異動與來源紀錄
 </h3>
 <button id="undoBtnHistory" onclick="undoLastAction()" class="parent-only hidden px-3 py-1 bg-amber-100 text-amber-700 font-semibold rounded-lg text-sm hover:bg-amber-200 transition flex items-center space-x-1">
 <i class="fa-solid fa-rotate-left"></i><span>復原最近一條紀錄</span>
 </button>
 </div>
 <div id="historyList" class="bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-md space-y-2"></div>
 </div>

 </main>

 <!-- Set Direct Stars Modal -->
 <div id="setStarsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center">
 <h3 class="text-lg font-bold text-slate-700 mb-3">直接修改星星總數</h3>
 <input type="number" id="directStarsInput" min="0" class="w-32 text-center text-3xl font-black bg-slate-100 border border-slate-300 rounded-xl py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-400">
 <div class="flex space-x-2">
 <button onclick="closeSetStarsModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-600 py-2 rounded-xl font-bold transition">取消</button>
 <button onclick="saveDirectStars()" class="w-1/2 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl font-bold transition">確定</button>
 </div>
 </div>
 </div>

 <!-- Change PIN Modal -->
 <div id="changePinModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center">
 <h3 class="text-lg font-bold text-slate-700 mb-3">修改家長密碼</h3>
 <div class="space-y-3 text-left">
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">新密碼 (4位數字)</label>
 <input type="password" id="newPinInput" maxlength="4" placeholder="••••" class="w-full text-center tracking-widest text-xl bg-slate-100 border border-slate-300 rounded-xl py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
 </div>
 </div>
 <div class="flex space-x-2 mt-4">
 <button onclick="closeChangePinModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-600 py-2 rounded-xl font-bold transition">取消</button>
 <button onclick="saveNewPin()" class="w-1/2 bg-slate-700 hover:bg-slate-800 text-white py-2 rounded-xl font-bold transition">儲存</button>
 </div>
 </div>
 </div>

 <!-- Parent Password / Mode Modal -->
 <div id="parentPinModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center">
 <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
 <i class="fa-solid fa-lock"></i>
 </div>
 <h3 class="text-lg font-bold text-slate-700 mb-2">請輸入家長密碼</h3>
 <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="w-32 text-center tracking-widest text-2xl bg-slate-100 border border-slate-300 rounded-xl py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-400">
 <div class="flex space-x-2">
 <button onclick="closePinModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-600 py-2 rounded-xl font-bold transition">取消</button>
 <button onclick="verifyPin()" class="w-1/2 bg-purple-600 hover:bg-purple-700 text-white py-2 rounded-xl font-bold transition">確認</button>
 </div>
 </div>
 </div>

 <!-- Custom Task Complete Modal -->
 <div id="customTaskModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
 <div class="flex justify-between items-center mb-4">
 <h3 class="text-lg font-bold text-slate-700"><i class="fa-solid fa-star text-yellow-400 mr-2"></i>獎勵 Moon 星星</h3>
 <button onclick="closeCustomTaskModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold"><i class="fa-solid fa-xmark"></i></button>
 </div>
 <div class="space-y-4">
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">因咩事獲得星星？</label>
 <input type="text" id="taskReason" placeholder="例如：乖乖食完晚飯..." class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
 </div>
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">星星數量</label>
 <input type="number" id="taskStarsCount" value="1" min="1" max="50" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
 </div>
 <button onclick="submitCustomTask()" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-2.5 rounded-xl font-bold transition shadow">確認發放星星</button>
 </div>
 </div>
 </div>

 <!-- Add/Edit Task Modal -->
 <div id="taskEditModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
 <div class="flex justify-between items-center mb-4">
 <h3 id="taskModalTitle" class="text-lg font-bold text-slate-700">新增儲星任務</h3>
 <button onclick="closeTaskEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold"><i class="fa-solid fa-xmark"></i></button>
 </div>
 <div class="space-y-4">
 <input type="hidden" id="editTaskId">
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">任務名稱 (含 Emoji)</label>
 <input type="text" id="editTaskName" placeholder="例如：練琴 30 分鐘 🎹" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
 </div>
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">完成可得星星數</label>
 <input type="number" id="editTaskStars" value="2" min="1" max="30" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
 </div>
 <button onclick="saveTask()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2.5 rounded-xl font-bold transition shadow">儲存任務</button>
 </div>
 </div>
 </div>

 <!-- Add/Edit Reward Modal -->
 <div id="rewardModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
 <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl">
 <div class="flex justify-between items-center mb-4">
 <h3 id="rewardModalTitle" class="text-lg font-bold text-slate-700">新增獎勵</h3>
 <button onclick="closeRewardModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold"><i class="fa-solid fa-xmark"></i></button>
 </div>
 <div class="space-y-4">
 <input type="hidden" id="rewardId">
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">獎勵名稱</label>
 <input type="text" id="rewardName" placeholder="例如：心儀的中玩具..." class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
 </div>
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">所需星星數</label>
 <input type="number" id="rewardCost" value="20" min="1" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
 </div>
 <div>
 <label class="block text-xs font-semibold text-slate-500 mb-1">圖示表情 (Emoji)</label>
 <input type="text" id="rewardIcon" value="🧸" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-400">
 </div>
 <button onclick="saveReward()" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-2.5 rounded-xl font-bold transition shadow">儲存獎勵</button>
 </div>
 </div>
 </div>

 <!-- Toast message box -->
 <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center space-x-2">
 <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
 <span id="toastMsg" class="text-sm font-medium">提示訊息</span>
 </div>

 <script>
 // 請將下方 scriptUrl 替換為你在 Google Apps Script 部署獲得的 Web App URL
 const scriptUrl = "https://script.google.com/macros/s/AKfycbyDk6lcUC1OxvuGWhe4HhiO-MUUwVNxr2lMeJQKCcJ1DOHUkUPdvkXZXy0Y_8RnQb1aDg/exec";

 let chartData = {
 stars: 12,
 parentPin: '1773',
 rewards: [
 { id: 'r1', name: '去一次雪糕店食雪糕 🍦', cost: 20, icon: '🍦' },
 { id: 'r2', name: '心儀的小玩具 🧸', cost: 40, icon: '🧸' },
 { id: 'r3', name: '心儀的中玩具 🧸', cost: 60, icon: '🧸' },
 { id: 'r4', name: '心儀的大玩具 🎁', cost: 80, icon: '🎁' }
 ],
 tasks: [
 { id: 't_dictation', name: '默書 90 分或以上 📝', stars: 4 },
 { id: 't_piano', name: '練琴 30 分鐘 🎹', stars: 2 },
 { id: 't_homework', name: '做功課 ✏️', stars: 2 },
 { id: 't_book', name: '抄好手冊 📖', stars: 1 },
 { id: 't_housework', name: '主動幫手做小家務 🧹', stars: 3 }
 ],
 history: [
 { text: '初始設立樂園贈送鼓勵星 (總計 12 粒)', stars: 12, time: '系統初始化' }
 ]
 };

 let isParentMode = false;

 window.addEventListener('DOMContentLoaded', () => {
 const saved = localStorage.getItem('star_chart_moon_data');
 if (saved) {
 try {
 const parsed = JSON.parse(saved);
 chartData = { ...chartData, ...parsed };
 } catch(e) { console.error(e); }
 }
 renderAll();
 fetchCloudData();
 });

 function fetchCloudData() {
 const statusEl = document.getElementById('syncStatusIndicator');
 if (scriptUrl.includes("YOUR_SCRIPT_ID_HERE") || !scriptUrl.startsWith("https://script.google.com/")) {
 statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i> 請先於 JS 設定正確的 Google Apps Script URL (目前使用本地快取)`;
 return;
 }

 statusEl.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-blue-500 mr-1"></i> 正在向雲端同步資料...`;
 
 fetch(scriptUrl, {
 method: 'GET',
 mode: 'cors',
 cache: 'no-cache'
 })
 .then(res => res.json())
 .then(data => {
 if (data && typeof data.stars === 'number') {
 chartData = data;
 localStorage.setItem('star_chart_moon_data', JSON.stringify(chartData));
 renderAll();
 statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-500 mr-1"></i> 已連線 Google 雲端自動同步 ✨`;
 showToast("雲端資料同步成功！");
 } else {
 statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-500 mr-1"></i> 雲端無舊紀錄，已為你建立新數據頁面`;
 saveToStorage();
 }
 })
 .catch(err => {
 console.error("Cloud fetch error:", err);
 statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1"></i> 雲端連線失敗（請檢查 Google 部署權限是否設為「所有人」）`;
 });
 }

 function saveToStorage() {
 localStorage.setItem('star_chart_moon_data', JSON.stringify(chartData));
 renderAll();

 const statusEl = document.getElementById('syncStatusIndicator');
 if (scriptUrl.includes("YOUR_SCRIPT_ID_HERE") || !scriptUrl.startsWith("https://script.google.com/")) return;

 statusEl.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-pink-500 mr-1"></i> 正在上傳雲端...`;

 // 使用 text/plain 格式避免跨網域 CORS preflight 限制
 fetch(scriptUrl, {
 method: 'POST',
 mode: 'no-cors',
 headers: { 'Content-Type': 'text/plain;charset=utf-8' },
 body: JSON.stringify(chartData)
 }).then(() => {
 statusEl.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-emerald-500 mr-1"></i> 雲端同步完成 ✨`;
 }).catch((err) => {
 console.error("Cloud save error:", err);
 statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1"></i> 雲端上傳失敗`;
 });
 }

 window.toggleViewMode = function() {
 if (isParentMode) {
 isParentMode = false;
 updateModeUI();
 showToast("已切換回「Moon 模式」🌟");
 } else {
 document.getElementById('parentPinModal').classList.remove('hidden');
 document.getElementById('pinInput').value = '';
 document.getElementById('pinInput').focus();
 }
 };

 window.verifyPin = function() {
 const pin = document.getElementById('pinInput').value;
 const currentPin = chartData.parentPin || '1773';
 if (pin === currentPin) {
 isParentMode = true;
 document.getElementById('parentPinModal').classList.add('hidden');
 updateModeUI();
 showToast("已解鎖「家長模式」🔑");
 } else {
 showToast("密碼錯誤", "error");
 }
 };

 window.closePinModal = function() {
 document.getElementById('parentPinModal').classList.add('hidden');
 };

 window.openChangePinModal = function() {
 document.getElementById('newPinInput').value = '';
 document.getElementById('changePinModal').classList.remove('hidden');
 };

 window.closeChangePinModal = function() {
 document.getElementById('changePinModal').classList.add('hidden');
 };

 window.saveNewPin = function() {
 const newPin = document.getElementById('newPinInput').value.trim();
 if (!newPin || newPin.length !== 4 || isNaN(newPin)) {
 showToast("請輸入合法的 4 位數字密碼", "error");
 return;
 }
 chartData.parentPin = newPin;
 closeChangePinModal();
 saveToStorage();
 showToast("家長密碼修改成功！✨");
 };

 function updateModeUI() {
 const modeText = document.getElementById('modeText');
 const parentControls = document.getElementById('parentControls');
 const parentOnlyEls = document.querySelectorAll('.parent-only');

 if (isParentMode) {
 modeText.innerText = "退出家長模式";
 parentControls.classList.remove('hidden');
 parentOnlyEls.forEach(el => el.classList.remove('hidden'));
 } else {
 modeText.innerText = "家長模式";
 parentControls.classList.add('hidden');
 parentOnlyEls.forEach(el => el.classList.add('hidden'));
 }
 }

 window.switchTab = function(tabName) {
 document.getElementById('tabRewards').classList.add('hidden');
 document.getElementById('tabTasks').classList.add('hidden');
 document.getElementById('tabHistory').classList.add('hidden');

 document.getElementById('tabRewardsBtn').className = "px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-white/80 text-slate-600 hover:bg-white";
 document.getElementById('tabTasksBtn').className = "px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-white/80 text-slate-600 hover:bg-white";
 document.getElementById('tabHistoryBtn').className = "px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-white/80 text-slate-600 hover:bg-white";

 if (tabName === 'rewards') {
 document.getElementById('tabRewards').classList.remove('hidden');
 document.getElementById('tabRewardsBtn').className = "px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-pink-500 text-white";
 } else if (tabName === 'tasks') {
 document.getElementById('tabTasks').classList.remove('hidden');
 document.getElementById('tabTasksBtn').className = "px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-blue-500 text-white";
 } else if (tabName === 'history') {
 document.getElementById('tabHistory').classList.remove('hidden');
 document.getElementById('tabHistoryBtn').className = "px-6 py-2.5 rounded-2xl font-bold transition shadow-md bg-purple-500 text-white";
 }
 };

 window.undoLastAction = function() {
 if (!chartData.history || chartData.history.length === 0) {
 showToast("沒有可復原的歷史紀錄", "error");
 return;
 }

 const lastItem = chartData.history.shift(); 
 const revertStars = lastItem.stars || 0;
 chartData.stars = Math.max(0, chartData.stars - revertStars);

 addHistory(`[復原] 已撤銷上筆操作：「${lastItem.text}」`, -revertStars, true);
 saveToStorage();
 showToast(`已復原上一筆紀錄，星星已更新！`);
 };

 window.adjustStars = function(amount) {
 chartData.stars += amount;
 addHistory(amount > 0 ? `手動增加星星 (+${amount})` : `扣減星星 (${amount})`, amount);
 saveToStorage();
 showToast(amount > 0 ? `太棒了！獲得 ${amount} 粒星星 🌟` : `已更新星星數量`);
 };

 window.openSetStarsModal = function() {
 document.getElementById('directStarsInput').value = chartData.stars;
 document.getElementById('setStarsModal').classList.remove('hidden');
 };

 window.closeSetStarsModal = function() {
 document.getElementById('setStarsModal').classList.add('hidden');
 };

 window.saveDirectStars = function() {
 const newTotal = parseInt(document.getElementById('directStarsInput').value);
 if (isNaN(newTotal) || newTotal < 0) {
 showToast("請輸入有效的數字", "error");
 return;
 }
 const diff = newTotal - chartData.stars;
 chartData.stars = newTotal;
 addHistory(`家長手動將總星星數修改為 ${newTotal} 粒`, diff);
 closeSetStarsModal();
 saveToStorage();
 showToast("已成功更新星星總數！✨");
 };

 window.openCustomTaskModal = function() {
 document.getElementById('customTaskModal').classList.remove('hidden');
 document.getElementById('taskReason').value = '';
 document.getElementById('taskStarsCount').value = 1;
 };

 window.closeCustomTaskModal = function() {
 document.getElementById('customTaskModal').classList.add('hidden');
 };

 window.submitCustomTask = function() {
 const reason = document.getElementById('taskReason').value.trim() || "完成良好表現";
 const count = parseInt(document.getElementById('taskStarsCount').value) || 1;
 chartData.stars += count;
 addHistory(`Moon 達成任務：「${reason}」`, count);
 closeCustomTaskModal();
 saveToStorage();
 showToast(`成功發放 ${count} 粒星星畀 Moon！🎉`);
 };

 window.completeTaskDirect = function(taskName, stars) {
 chartData.stars += stars;
 addHistory(`Moon 完成任務：「${taskName}」`, stars);
 saveToStorage();
 showToast(`好乖呀 Moon！完成任務獲得 ${stars} 粒星星 🌟`);
 };

 window.openAddTaskModal = function() {
 document.getElementById('taskModalTitle').innerText = "新增儲星任務";
 document.getElementById('editTaskId').value = '';
 document.getElementById('editTaskName').value = '';
 document.getElementById('editTaskStars').value = 2;
 document.getElementById('taskEditModal').classList.remove('hidden');
 };

 window.openEditTaskModal = function(taskId) {
 const task = chartData.tasks.find(t => t.id === taskId);
 if (!task) return;
 document.getElementById('taskModalTitle').innerText = "修改儲星任務";
 document.getElementById('editTaskId').value = task.id;
 document.getElementById('editTaskName').value = task.name;
 document.getElementById('editTaskStars').value = task.stars;
 document.getElementById('taskEditModal').classList.remove('hidden');
 };

 window.closeTaskEditModal = function() {
 document.getElementById('taskEditModal').classList.add('hidden');
 };

 window.saveTask = function() {
 const id = document.getElementById('editTaskId').value;
 const name = document.getElementById('editTaskName').value.trim();
 const stars = parseInt(document.getElementById('editTaskStars').value) || 2;

 if (!name) {
 showToast("請輸入任務名稱", "error");
 return;
 }

 if (id) {
 const task = chartData.tasks.find(t => t.id === id);
 if (task) {
 task.name = name;
 task.stars = stars;
 showToast("修改任務成功！");
 }
 } else {
 chartData.tasks.push({
 id: 't_' + Date.now(),
 name: name,
 stars: stars
 });
 showToast("新增任務成功！");
 }

 closeTaskEditModal();
 saveToStorage();
 };

 window.deleteTask = function(taskId) {
 chartData.tasks = chartData.tasks.filter(t => t.id !== taskId);
 saveToStorage();
 showToast("已刪除任務");
 };

 window.redeemReward = function(rewardId) {
 const reward = chartData.rewards.find(r => r.id === rewardId);
 if (!reward) return;

 if (chartData.stars < reward.cost) {
 showToast(`星星還不夠哦 Moon！還差 ${reward.cost - chartData.stars} 粒星星 ✨`, "error");
 return;
 }

 chartData.stars -= reward.cost;
 addHistory(`Moon 成功兌換獎勵：${reward.name}`, -reward.cost);
 saveToStorage();
 showToast(`恭喜 Moon 成功兌換「${reward.name}」！🎁🎉`);
 };

 window.openAddRewardModal = function() {
 document.getElementById('rewardModalTitle').innerText = "新增獎勵";
 document.getElementById('rewardId').value = '';
 document.getElementById('rewardName').value = '';
 document.getElementById('rewardCost').value = 20;
 document.getElementById('rewardIcon').value = '🧸';
 document.getElementById('rewardModal').classList.remove('hidden');
 };

 window.openEditRewardModal = function(rewardId) {
 const reward = chartData.rewards.find(r => r.id === rewardId);
 if (!reward) return;
 document.getElementById('rewardModalTitle').innerText = "修改獎勵設定";
 document.getElementById('rewardId').value = reward.id;
 document.getElementById('rewardName').value = reward.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5\s]/g, '').trim();
 document.getElementById('rewardCost').value = reward.cost;
 document.getElementById('rewardIcon').value = reward.icon || '🎁';
 document.getElementById('rewardModal').classList.remove('hidden');
 };

 window.closeRewardModal = function() {
 document.getElementById('rewardModal').classList.add('hidden');
 };

 window.saveReward = function() {
 const id = document.getElementById('rewardId').value;
 const name = document.getElementById('rewardName').value.trim();
 const cost = parseInt(document.getElementById('rewardCost').value) || 20;
 const icon = document.getElementById('rewardIcon').value.trim() || '🎁';

 if (!name) {
 showToast("請輸入獎勵名稱", "error");
 return;
 }

 if (id) {
 const reward = chartData.rewards.find(r => r.id === id);
 if (reward) {
 reward.name = `${name} ${icon}`;
 reward.cost = cost;
 reward.icon = icon;
 showToast("成功更新獎勵！✨");
 }
 } else {
 const newReward = {
 id: 'r_' + Date.now(),
 name: `${name} ${icon}`,
 cost: cost,
 icon: icon
 };
 chartData.rewards.push(newReward);
 showToast("新增獎勵成功！🎉");
 }

 closeRewardModal();
 saveToStorage();
 };

 window.deleteReward = function(rewardId) {
 chartData.rewards = chartData.rewards.filter(r => r.id !== rewardId);
 saveToStorage();
 showToast("已刪除獎勵");
 };

 function addHistory(text, stars, isUndoRecord = false) {
 const dateStr = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
 chartData.history.unshift({
 text: text,
 stars: stars,
 time: dateStr,
 isUndo: isUndoRecord
 });
 if (chartData.history.length > 30) chartData.history.pop();
 }

 function showToast(msg, type = 'success') {
 const toast = document.getElementById('toast');
 const toastMsg = document.getElementById('toastMsg');
 const toastIcon = document.getElementById('toastIcon');

 toastMsg.innerText = msg;
 if (type === 'error') {
 toastIcon.className = "fa-solid fa-circle-exclamation text-pink-400";
 } else {
 toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
 }

 toast.classList.remove('translate-y-20', 'opacity-0');
 setTimeout(() => {
 toast.classList.add('translate-y-20', 'opacity-0');
 }, 3000);
 }

 function renderAll() {
 document.getElementById('totalStars').innerText = chartData.stars;

 // Render Rewards
 const rewardsGrid = document.getElementById('rewardsGrid');
 rewardsGrid.innerHTML = '';
 chartData.rewards.forEach(r => {
 const canAfford = chartData.stars >= r.cost;
 const card = document.createElement('div');
 card.className = `bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-md border-2 ${canAfford ? 'border-pink-300' : 'border-slate-100'} flex flex-col justify-between transition hover:shadow-lg`;
 card.innerHTML = `
 <div>
 <div class="flex justify-between items-start mb-2">
 <span class="text-3xl">${r.icon || '🎁'}</span>
 <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold flex items-center space-x-1">
 <i class="fa-solid fa-star text-amber-500 mr-1"></i> ${r.cost} 粒星
 </span>
 </div>
 <h4 class="font-bold text-slate-700 text-lg mb-1">${r.name}</h4>
 </div>
 <div class="mt-4 flex items-center justify-between">
 <button onclick="redeemReward('${r.id}')" class="w-full py-2 rounded-xl font-bold text-sm shadow transition ${canAfford ? 'bg-gradient-to-r from-pink-500 to-rose-500 text-white hover:from-pink-600 hover:to-rose-600' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
 ${canAfford ? '✨ 立即兌換！' : '🔒 星星未夠'}
 </button>
 <div class="parent-only ${isParentMode ? 'flex' : 'hidden'} ml-2 space-x-1 shrink-0">
 <button onclick="openEditRewardModal('${r.id}')" class="text-slate-400 hover:text-blue-500 p-2 text-sm" title="修改獎勵">
 <i class="fa-solid fa-pen"></i>
 </button>
 <button onclick="deleteReward('${r.id}')" class="text-slate-400 hover:text-red-500 p-2 text-sm" title="刪除獎勵">
 <i class="fa-solid fa-trash"></i>
 </button>
 </div>
 </div>
 `;
 rewardsGrid.appendChild(card);
 });

 // Render Tasks
 const tasksGrid = document.getElementById('tasksGrid');
 tasksGrid.innerHTML = '';
 chartData.tasks.forEach(t => {
 const taskCard = document.createElement('div');
 taskCard.className = "bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-md border-2 border-blue-200 flex items-center justify-between transition hover:shadow-lg";
 taskCard.innerHTML = `
 <div>
 <h4 class="font-bold text-slate-700 text-base mb-1">${t.name}</h4>
 <span class="inline-flex items-center text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-full">
 <i class="fa-solid fa-star text-amber-400 mr-1"></i> +${t.stars} 粒星
 </span>
 </div>
 <div class="flex items-center space-x-2">
 <button onclick="completeTaskDirect('${t.name.replace(/'/g, "\\'")}', ${t.stars})" class="parent-only ${isParentMode ? 'flex' : 'hidden'} bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-xl text-sm font-bold shadow transition items-center space-x-1">
 <i class="fa-solid fa-check"></i><span>完成</span>
 </button>
 <div class="parent-only ${isParentMode ? 'flex' : 'hidden'} space-x-1">
 <button onclick="openEditTaskModal('${t.id}')" class="text-slate-400 hover:text-blue-500 p-2 text-sm" title="修改任務">
 <i class="fa-solid fa-pen"></i>
 </button>
 <button onclick="deleteTask('${t.id}')" class="text-slate-400 hover:text-red-500 p-2 text-sm" title="刪除任務">
 <i class="fa-solid fa-trash"></i>
 </button>
 </div>
 </div>
 `;
 tasksGrid.appendChild(taskCard);
 });

 // Render History
 const historyList = document.getElementById('historyList');
 historyList.innerHTML = '';
 if (chartData.history.length === 0) {
 historyList.innerHTML = `<div class="text-center text-slate-400 py-4 text-sm">暫無紀錄</div>`;
 } else {
 chartData.history.forEach(h => {
 const item = document.createElement('div');
 item.className = "flex justify-between items-center bg-slate-50 p-3 rounded-xl text-sm";
 item.innerHTML = `
 <div class="flex items-center space-x-2">
 <i class="fa-solid fa-circle-dot text-xs ${h.stars > 0 ? 'text-emerald-500' : h.stars < 0 ? 'text-rose-500' : 'text-slate-400'}"></i>
 <span class="font-medium text-slate-700">${h.text}</span>
 </div>
 <div class="text-right">
 <span class="text-xs text-slate-400 block">${h.time}</span>
 </div>
 `;
 historyList.appendChild(item);
 });
 }

 updateModeUI();
 }
 </script>
</body>
</html>
